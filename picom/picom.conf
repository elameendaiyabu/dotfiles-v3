#################################################################
#  picom v12+/v13 — rules-based config with native animations.
#  (The old jonaburg "transitions"/"experimental-backends" keys
#   are not understood by mainline picom and were ignored.)
#################################################################

#──────────────── Backend / anti-flicker ────────────────#
backend = "glx";
vsync = true;
# Repaint only what changed, and fence X rendering before GL reads it.
# The sync fence is what stops stale frames / ghost residue on NVIDIA
# hybrid setups when a window sits unchanged for a long time.
use-damage = true;
xrender-sync-fence = true;
unredir-if-possible = false;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
log-level = "warn";

#──────────────── Defaults for every window ────────────────#
corner-radius = 12;

shadow = true;
shadow-radius = 20;
shadow-opacity = 0.32;
shadow-offset-x = -16;
shadow-offset-y = -12;

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

blur-method = "dual_kawase";
blur-strength = 5;
blur-background = false;

#──────────────── Animations ────────────────#
animations = (
  {
    triggers = [ "open", "show" ];
    preset = "appear";
    duration = 0.2;
    scale = 0.94;
  },
  {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    duration = 0.14;
    scale = 0.96;
  },
  {
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.18;
  },
);

#──────────────── Per-window rules ────────────────#
rules = (
  # polybar draws its own 24px-radius island; blur what's behind it
  { match = "window_type = 'dock' || class_g = 'Polybar'";
    corner-radius = 24; shadow = false; blur-background = true; animations = (); },

  { match = "window_type = 'desktop'"; corner-radius = 0; shadow = false; },

  { match = "window_type = 'tooltip'";
    shadow = false; opacity = 0.96; full-shadow = false; },

  { match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu'";
    shadow = false; corner-radius = 8; },

  # frosted terminals
  { match = "class_g = 'kitty' || class_g = 'com.mitchellh.ghostty'";
    blur-background = true; },

  # rofi: quick pop-in, frosted, radius matches the rasi theme
  { match = "class_g = 'Rofi'";
    corner-radius = 16; blur-background = true; shadow = true;
    animations = (
      { triggers = [ "open", "show" ]; preset = "appear"; duration = 0.16; scale = 0.9; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.1; scale = 0.95; },
    ); },

  # notifications slide in from the right edge
  { match = "class_g = 'Dunst'";
    corner-radius = 12; blur-background = true; shadow = false;
    animations = (
      { triggers = [ "open", "show" ]; preset = "slide-in"; direction = "right"; duration = 0.25; },
      { triggers = [ "close", "hide" ]; preset = "slide-out"; direction = "right"; duration = 0.2; },
    ); },

  # lock screen fades in over everything, no rounding or shadow
  { match = "class_g = 'i3lock'";
    corner-radius = 0; shadow = false;
    animations = ( { triggers = [ "open", "show" ]; preset = "appear"; duration = 0.3; scale = 1.0; } ); },

  { match = "fullscreen"; corner-radius = 0; shadow = false; },

  # GTK client-side decorations already draw their own shadows
  { match = "_GTK_FRAME_EXTENTS"; shadow = false; blur-background = false; },

  # screenshot selection tools must never be faded or blurred
  { match = "class_g = 'slop' || class_g = 'flameshot' || name = 'scrot'";
    shadow = false; blur-background = false; fade = false; animations = (); corner-radius = 0; },
);
