# Alpine Sunset — kitty colorscheme
# Sampled from Mikael Gustafsson's sunset-forest wallpaper to match polybar.
# Night-forest navy base · teal/cyan sky · warm sunset orange/gold/coral/pink.

foreground            #C9D6E0
background            #161F2B
selection_foreground  #161F2B
selection_background  #F2A65A

cursor                #6FD6D6
