;══════════════════════════════════════════════════════════════
;  polybar · floating island bar
;  colours come from the active system theme (theme-switch);
;  edit palettes in ~/.config/themes/<name>/palette.sh
;══════════════════════════════════════════════════════════════

include-file = /home/alamin/.config/themes/current/polybar.ini

[bar/main]
; follow Xft.dpi so pt sizes match the rest of the desktop
dpi = ${xrdb:Xft.dpi:96}
width  = 100%:-27pt
height = 19pt
offset-x = 13.5pt
offset-y = 5pt
radius = 24

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
padding-left  = 1
padding-right = 2
module-margin = 1

font-0 = "JetBrainsMono Nerd Font Propo:style=Bold:size=9;5"
font-1 = "JetBrainsMono Nerd Font Propo:size=11;6"

modules-left   = launcher i3 profile-mode
modules-center = date
modules-right  = tray theme pulseaudio backlight wlan memory battery power

cursor-click  = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = i3
override-redirect = true

;══════════════════════════════════════════════════════════════
[module/launcher]
type = custom/text
format = 󰣇
format-font = 2
format-foreground = ${colors.accent}
format-padding = 1
click-left = rofi -show drun -dpi 1 &

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
enable-scroll = false
format = <label-state> <label-mode>

label-mode = %mode%
label-mode-foreground = ${colors.background-solid}
label-mode-background = ${colors.accent2}
label-mode-padding = 1

label-focused = %name%
label-focused-foreground = ${colors.background-solid}
label-focused-background = ${colors.accent}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.fg-dim}
label-unfocused-padding = 1

label-visible = %name%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.background-solid}
label-urgent-background = ${colors.red}
label-urgent-padding = 1

[module/profile-mode]
type = custom/script
exec = ~/.config/custom-scripts/profile-mode.sh
interval = 5
format-prefix = "󱪈 "
format-prefix-foreground = ${colors.accent2}
label-foreground = ${colors.fg-dim}
click-left = asusctl profile next

;══════════════════════════════════════════════════════════════
[module/date]
type = internal/date
interval = 1
date     = %H:%M
date-alt = %A, %d %B  %H:%M:%S
label = %date%
format-prefix = "󰥔 "
format-prefix-foreground = ${colors.accent}
label-foreground = ${colors.foreground}

;══════════════════════════════════════════════════════════════
[module/tray]
type = internal/tray
tray-size = 55%
tray-spacing = 6pt
format-margin = 4pt

[module/theme]
type = custom/text
format = 󰏘
format-foreground = ${colors.accent2}
click-left = ~/.config/themes/bin/theme-picker &
click-right = ~/.config/themes/bin/theme-switch --next &
scroll-up = ~/.config/themes/bin/theme-switch --wall next &
scroll-down = ~/.config/themes/bin/theme-switch --wall prev &

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.accent}
format-muted = <label-muted>
label-muted = 󰝟 muted
label-muted-foreground = ${colors.muted}
click-right = pavucontrol &

[module/backlight]
type = internal/backlight
card = amdgpu_bl2
enable-scroll = true
format = <ramp> <label>
label = %percentage%%
ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠
ramp-foreground = ${colors.yellow}

[module/wlan]
type = internal/network
interface = wlp4s0
interval = 3
format-connected = <ramp-signal> <label-connected>
label-connected = %essid:0:14:…%
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨
ramp-signal-foreground = ${colors.cyan}
format-disconnected = <label-disconnected>
label-disconnected = 󰤭 offline
label-disconnected-foreground = ${colors.muted}
click-left = ~/.config/custom-scripts/wifi-menu.sh &

[module/memory]
type = internal/memory
interval = 3
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.magenta}
label = %percentage_used%%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC0
full-at = 99
low-at = 15
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
format-low = <ramp-capacity> <label-low>
label-low-foreground = ${colors.red}

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁾
ramp-capacity-4 = 󰂀
ramp-capacity-5 = 󰂁
ramp-capacity-6 = 󰁹
ramp-capacity-0-foreground = ${colors.red}
ramp-capacity-1-foreground = ${colors.orange}
ramp-capacity-foreground = ${colors.green}

animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂈
animation-charging-3 = 󰢝
animation-charging-4 = 󰂊
animation-charging-5 = 󰂋
animation-charging-6 = 󰂅
animation-charging-foreground = ${colors.green}
animation-charging-framerate = 750

[module/power]
type = custom/text
format = ⏻
format-foreground = ${colors.red}
format-padding = 1
click-left = ~/.config/themes/bin/powermenu &

;══════════════════════════════════════════════════════════════
[settings]
screenchange-reload = true
; real ARGB transparency through picom — pseudo-transparency left stale
; wallpaper fragments behind the bar
pseudo-transparency = false

; vim:ft=dosini
